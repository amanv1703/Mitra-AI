services:
  - type: web
    name: mitra-ai-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_CONNECTION_LIMIT
        value: "10"
      - key: AI_PROVIDER
        value: local_mock
      - key: AI_MODEL
        value: gemini-1.5-pro
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MAX_AUTO_REORDER_VALUE
        value: "25000.00"
      - key: AI_MAX_AUTO_REFUND_LIMIT
        value: "2000.00"
      - key: AI_MAX_PRICE_ADJUSTMENT_PCT
        value: "10.0"
      - key: AI_REQUIRE_HUMAN_APPROVAL_HIGH_RISK
        value: "true"
      - key: ENABLE_PROACTIVE_SCHEDULER
        value: "true"
